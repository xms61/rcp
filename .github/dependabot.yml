version: 2
updates:
  # Keeps the SHA-pinned actions in the workflows current; the version comments update with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Minor and patch updates arrive as one grouped PR; each major gets its own. `npm` is Dependabot's name for
  # the JavaScript ecosystem; it updates pnpm-lock.yaml too.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
