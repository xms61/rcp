version: 2
updates:
  # Keeps the SHA-pinned actions in the workflows current; the version comments update with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The API image's pinned base (apps/api/Dockerfile), so Node and alpine security fixes arrive as PRs.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly

  # Minor and patch updates arrive as one grouped PR; each major gets its own. `npm` is Dependabot's name for
  # the JavaScript ecosystem; it updates pnpm-lock.yaml too.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # @types/node follows the Node major in .nvmrc (24); move both together, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
